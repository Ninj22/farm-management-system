version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: farm_admin
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: farm_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm_admin -d farm_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://farm_admin:devpassword@db:5432/farm_management
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
